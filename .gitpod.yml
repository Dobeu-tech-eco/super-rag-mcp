# .gitpod.yml — reproducible RAG dev environment (Ona / Gitpod).
tasks:
  - name: setup
    init: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      uv venv && uv pip install -e ".[dev,mcp,cloud]"
      sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      curl -fsSL https://ollama.com/install.sh | sh
    command: |
      ollama serve &
      ollama pull znbang/bge:small-en-v1.5-q8_0
      ollama pull qwen2.5:7b
      echo "Ready. Copy config.example.yaml -> config.yaml, then: rag-mcp -c config.yaml"
# To also work a paired bridge repo in the same workspace, add it under
# additionalRepositories (Gitpod) or clone it in the init task above.
