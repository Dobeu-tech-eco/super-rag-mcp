sources:
  - kind: localfs
    paths:
      - C:\Users\jswil\Documents\rag-test-corpus

  # --- Cloud sources (Composio). Require the `composio:` block below + the cloud extra
  #     (`uv pip install -e ".[dev,cloud]"`) and COMPOSIO_API_KEY exported. The `accounts`
  #     values are aliases defined under composio.connected_accounts. Uncomment to enable.
  # - kind: gdrive
  #     accounts: [personal-jeremy]
  #     mime_filter: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document]
  # - kind: onedrive
  #     accounts: [work-dobeu]
  #     mime_filter: [application/pdf]
  # - kind: gmail
  #     accounts: [personal-jeremy]      # indexes attachments only
  #     mime_filter: [application/pdf]
  # - kind: outlook
  #     accounts: [work-dobeu]           # indexes attachments only; M365/Enterprise mailboxes
  #     mime_filter: [application/pdf]

embedding:
  model: bge-small-en-v1.5
  ollama_url: http://localhost:11434
  batch_size: 32

chunking:
  primary: sentence
  fallback_size: 512
  overlap: 64

ocr:
  enabled: true
  strategy: auto_detect
  min_chars_per_page: 100

llm:
  default: claude-cli
  private_prefix: "private:"
  private_tag_routes_to: ollama
  ollama_model: qwen2.5:7b

paths:
  bundle_dir: C:\Users\jswil\rag-data\bundles
  dlq: C:\Users\jswil\rag-data\dlq.jsonl
  metadata: C:\Users\jswil\rag-data\meta.sqlite

# Composio auth for cloud connectors. Omit entirely for localfs-only setups.
# api_key_env names the environment variable holding your Composio API key (export it
#   before running cloud syncs, e.g. PowerShell: $env:COMPOSIO_API_KEY="..." ).
# connected_accounts maps each source account alias to its Composio connected-account ID.
#   Find the real IDs by listing your Composio connections (they look like the examples
#   below, one per connected mailbox/drive). One alias can be reused across source kinds
#   only if the same account is connected for each (e.g. Gmail + Drive for one Google login).
composio:
  api_key_env: COMPOSIO_API_KEY
  connected_accounts:
    personal-jeremy: googledrive_REPLACE_ME   # e.g. googledrive_xxxx / gmail_xxxx
    work-dobeu: one_drive_REPLACE_ME           # e.g. one_drive_xxxx / outlook_xxxx
