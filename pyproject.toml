[project]
name = "super-rag"
version = "0.3.0"
description = "Self-hosted RAG over Drive/OneDrive/Email/Local using LlamaIndex + TurboVec"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlite-utils>=3.36",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "python-docx>=1.1",
    "llama-index-core>=0.10",
    "httpx>=0.27",
    "click>=8.1",
    "turbovec>=0.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "respx>=0.21",
]
# Cloud connectors (Drive/OneDrive/Gmail/Outlook via Composio). Optional: localfs-only
# setups don't need it. Install with: uv pip install -e ".[dev,cloud]"
cloud = [
    "composio>=0.7",
]
# MCP server transport. Optional: CLI-only setups don't need it.
# Install with: uv pip install -e ".[dev,mcp]"
mcp = [
    "mcp>=1.2",
]

[project.scripts]
rag = "rag.serve.cli:main"
rag-mcp = "rag.serve.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
markers = [
    "integration: requires real services (Ollama, Claude CLI)",
]

[tool.coverage.run]
branch = true
source = ["src/rag"]
