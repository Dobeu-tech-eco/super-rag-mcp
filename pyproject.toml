[project]
name = "super-rag"
version = "0.3.0"
description = "Self-hosted RAG over Drive/OneDrive/Email/Local using LlamaIndex + TurboVec"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlite-utils>=4.2.1",
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "python-docx>=1.2.0",
    "llama-index-core>=0.14.25",
    "httpx>=0.28.1",
    "click>=8.5.0",
    "turbovec>=1.1.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "respx>=0.23.1",
]
# Cloud connectors (Drive/OneDrive/Gmail/Outlook via Composio). Optional: localfs-only
# setups don't need it. Install with: uv pip install -e ".[dev,cloud]"
cloud = [
    "composio>=0.25.0",
]
# MCP server transport. Optional: CLI-only setups don't need it.
# Install with: uv pip install -e ".[dev,mcp]"
mcp = [
    "mcp>=2.3.0",
]

[project.scripts]
rag = "rag.serve.cli:main"
rag-mcp = "rag.serve.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
markers = [
    "integration: requires real services (Ollama, Claude CLI)",
]

[tool.coverage.run]
branch = true
source = ["src/rag"]
