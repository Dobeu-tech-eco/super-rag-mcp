# Generated by dts2-harness setup. Runs the same checks the harness runs, so a green run here means the same thing.
name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: "python -m pip install -e '.[dev,mcp]'"
      - name: test
        run: "python3 -m pytest tests/unit -q"
      - name: lint
        run: "ruff check ."
      - name: repo checks
        run: "if [ -f .harness/checks.sh ]; then bash .harness/checks.sh; fi"
